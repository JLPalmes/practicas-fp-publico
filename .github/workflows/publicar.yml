name: Compilar y publicar Prácticas FP para Windows
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y probar
        shell: powershell
        run: ./Windows/Compilar.ps1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostico-windows
          path: dist/Windows/Windows-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            dist/Windows/Instalar-*.exe
            dist/Windows/Windows-*.png
  publicar:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: instalador-*
          path: distribucion
          merge-multiple: true
      - name: Publicar instaladores y licencia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          version=${version%%-publica.*}

          test -f "distribucion/Instalar-PracticasFP-$version-x64.exe"
          cp LICENSE AVISO-LICENCIA.txt distribucion/
          (cd distribucion && sha256sum *.exe LICENSE AVISO-LICENCIA.txt > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" distribucion/* --verify-tag --latest --title "Prácticas FP $version" --notes-file NOTAS-PUBLICACION.md
